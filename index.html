<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tommy Month Preview</title>
<style>
:root{
  --bg:#000;
  --panel:#04111f;
  --panel2:#02070d;
  --blue:#159dff;
  --blue2:#006dff;
  --green:#00f060;
  --red:#ff4b4b;
  --orange:#ff9500;
  --text:#edf7ff;
  --muted:#cfd7df;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:radial-gradient(circle at 50% 0%,rgba(21,157,255,.12),transparent 38%),#000;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}
.month-card{
  max-width:620px;
  margin:0 auto;
  border:2px solid var(--blue);
  border-radius:16px;
  background:linear-gradient(180deg,#061423,#02070d);
  box-shadow:0 0 20px rgba(21,157,255,.55), inset 0 0 22px rgba(21,157,255,.08);
  overflow:hidden;
}
.month-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px 2px;
}
.month-title{
  font-size:24px;
  line-height:1;
  font-weight:900;
  letter-spacing:.2px;
}
.month-toggle{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid var(--blue2);
  background:rgba(0,0,0,.45);
  color:var(--blue);
  font-size:30px;
  line-height:28px;
  font-weight:900;
  box-shadow:0 0 18px rgba(21,157,255,.9), inset 0 0 12px rgba(21,157,255,.25);
  cursor:pointer;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:6px 4px 8px;
}
.metric{
  position:relative;
  min-width:0;
  text-align:center;
  padding:0 8px;
}
.metric:not(:last-child)::after{
  content:"";
  position:absolute;
  right:0;
  top:6px;
  width:1px;
  height:72px;
  background:rgba(255,255,255,.33);
}
.icon{
  width:28px;
  height:28px;
  display:block;
  margin:0 auto 8px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 15px currentColor);
}
.label{
  display:block;
  color:#edf2f6;
  font-size:10px;
  font-weight:800;
  line-height:1.1;
  margin-bottom:10px;
}
.value{
  display:block;
  font-size:13px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}
.income .icon{color:var(--blue)}
.income .value{color:var(--green);text-shadow:0 0 10px rgba(0,240,96,.85),0 0 18px rgba(0,240,96,.45)}
.bills .icon,.bills .value{color:var(--red);text-shadow:0 0 10px rgba(255,75,75,.8),0 0 18px rgba(255,75,75,.42)}
.spend .icon,.spend .value{color:var(--orange);text-shadow:0 0 10px rgba(255,149,0,.85),0 0 18px rgba(255,149,0,.45)}
.savings .icon,.savings .value{color:var(--blue);text-shadow:0 0 10px rgba(21,157,255,.85),0 0 18px rgba(21,157,255,.45)}
.paychecks{
  display:none;
  padding:0 20px 22px;
}
.month-card.open .paychecks{display:block}
.month-card.open .month-toggle{font-size:46px}
.pay-row{
  display:grid;
  grid-template-columns:1fr auto auto auto 34px;
  align-items:center;
  gap:16px;
  margin-top:12px;
  padding:18px 20px;
  border:1px solid rgba(21,157,255,.32);
  border-radius:14px;
  background:rgba(3,14,27,.72);
}
.date{font-size:26px;font-weight:900}
.pay-label{font-size:13px;color:#aeb8c2;font-weight:800}
.pay-amount{font-size:23px;color:var(--green);font-weight:900;text-shadow:0 0 10px rgba(0,240,96,.65)}
.slash{font-size:24px;color:#c7cdd4}
.left-amount{font-size:23px;color:var(--red);font-weight:900;text-shadow:0 0 10px rgba(255,75,75,.65)}
.arrow{font-size:36px;color:#fff}
@media(max-width:600px){
  body{padding:10px}
  .month-card{border-radius:18px}
  .month-head{padding:18px 18px 4px}
  .month-title{font-size:34px}
  .month-toggle{width:54px;height:54px;font-size:42px;line-height:45px}
  .metrics{padding:18px 8px 20px}
  .metric{padding:0 3px}
  .metric:not(:last-child)::after{height:98px;top:4px}
  .icon{width:48px;height:48px;margin-bottom:12px}
  .label{font-size:13px;margin-bottom:9px}
  .value{font-size:16px}
  .paychecks{padding:0 12px 16px}
  .pay-row{grid-template-columns:1fr auto 1fr 24px;gap:8px;padding:15px 14px}
  .date{font-size:24px}
  .pay-label{font-size:10px}
  .pay-amount{font-size:10px}
  .slash,.left-amount{display:none}
  .arrow{font-size:32px}
}
</style>
</head>
<body>
<section class="month-card" id="monthCard">
  <div class="month-head">
    <div class="month-title">June 2026</div>
    <button class="month-toggle" id="monthToggle">+</button>
  </div>

  <div class="metrics">
    <div class="metric income">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 12h18"/><rect x="10" y="11" width="4" height="3" rx=".5"/></svg>
      <span class="label">Income</span>
      <span class="value">$4,272.43</span>
    </div>
    <div class="metric bills">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 10v9"/><path d="M9.5 13c0-1.1 1-2 2.5-2s2.5.9 2.5 2-1 1.6-2.5 1.6-2.5.5-2.5 1.7 1 2 2.5 2 2.5-.9 2.5-2"/></svg>
      <span class="label">Bills</span>
      <span class="value">$2,160.00</span>
    </div>
    <div class="metric spend">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h3l3 13h11l3-9H7"/><path d="M10 10h8"/></svg>
      <span class="label">Spend Left</span>
      <span class="value">$993.39</span>
    </div>
    <div class="metric savings">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 11c0-3.3 3.4-6 7.5-6 3.4 0 6.3 1.8 7.2 4.3H22v5h-2.3c-.5 1.3-1.5 2.4-2.9 3.2V21h-3v-2H10v2H7v-3.4C5.8 16.8 5 15.6 5 14H3v-3h2z"/><path d="M16 5V3"/><path d="M8 5.8 6 4"/><circle cx="17" cy="11" r=".5"/></svg>
      <span class="label">Savings</span>
      <span class="value">$758.43</span>
    </div>
  </div>

  <div class="paychecks">
    <div class="pay-row">
      <span class="date">Jun 12</span><span class="pay-label">Pay</span><span class="pay-amount">$2,107.83</span><span class="slash">/</span><span class="left-amount">$1,487.10</span><span class="arrow">›</span>
    </div>
    <div class="pay-row">
      <span class="date">Jun 26</span><span class="pay-label">Pay</span><span class="pay-amount">$2,164.60</span><span class="slash">/</span><span class="left-amount">$1,033.50</span><span class="arrow">›</span>
    </div>
  </div>
</section>

<script>
const card = document.getElementById('monthCard');
const btn = document.getElementById('monthToggle');
btn.addEventListener('click', () => {
  card.classList.toggle('open');
  btn.textContent = card.classList.contains('open') ? '−' : '+';
});
</script>
</body>
</html>
